<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - إدارة مزرعة الحمام</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3 py-sm-4">

<div class="card shadow-lg border-0 rounded-4 my-auto" style="max-width: 480px; width: 100%;">
    <div class="card-body p-3 p-sm-4 text-center">
        <div class="mb-3">
            <span style="font-size: 40px;">📝</span>
            <h4 class="fw-bold text-primary mt-2 fs-4">إنشاء حساب مربي جديد</h4>
        </div>

        <form method="POST" class="text-start">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label text-secondary fw-bold small">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <div class="form-text text-muted" style="font-size: 11px;">{{ field.help_text }}</div>
                {% endif %}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <script>
                document.querySelectorAll('input').forEach(i => i.classList.add('form-control', 'form-control-lg', 'fs-6'));
            </script>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success btn-lg rounded-3 fw-bold fs-6 py-2">إنشاء الحساب 🎯</button>
            </div>
        </form>

        <hr class="my-3 my-sm-4">
        <p class="mb-0 text-secondary small">لديك حساب بالفعل؟ <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">سجل دخولك هنا</a></p>
    </div>
</div>

</body>
</html>
