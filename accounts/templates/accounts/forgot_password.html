<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة السر - مزرعتي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card shadow-lg border-0 rounded-4 my-auto" style="max-width: 420px; width: 100%;">
    <div class="card-body p-3 p-sm-4 text-center">
        <div class="mb-3">
            <span style="font-size: 45px;">🔑</span>
            <h4 class="fw-bold text-primary mt-2 fs-4">استعادة كلمة السر</h4>
            <p class="text-muted small mb-0">أدخل اسم المستخدم أو البريد الإلكتروني المرتبط بحسابك لإرسال رمز التحقق (OTP).</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} py-2 small my-2">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="text-start mt-3">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary fw-bold small">اسم المستخدم أو البريد الإلكتروني <span class="text-danger">*</span></label>
                <input type="text" name="identifier" class="form-control form-control-lg fs-6" placeholder="مثال: user@example.com" required autofocus autocomplete="off">
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold fs-6 py-2">
                    إرسال رمز التحقق 📲
                </button>
            </div>
        </form>

        <hr class="my-3 my-sm-4">
        <p class="mb-0 text-secondary small">
            تذكرت كلمة السر؟ <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">تسجيل الدخول</a>
        </p>
    </div>
</div>

</body>
</html>
