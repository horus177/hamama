<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة السر - مزرعتي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .letter-spacing-2 {
            letter-spacing: 0.5rem;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3 py-sm-4">

<div class="card shadow-lg border-0 rounded-4 my-auto" style="max-width: 440px; width: 100%;">
    <div class="card-body p-3 p-sm-4 text-center">
        <div class="mb-3">
            <span style="font-size: 45px;">🔒</span>
            <h4 class="fw-bold text-primary mt-2 fs-4">كلمة سر جديدة</h4>
            <p class="text-muted small mb-0">أدخل رمز التحقق (OTP) المكوّن من 6 أرقام مع كلمة السر الجديدة.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} py-2 small my-2">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="text-start mt-3">
            {% csrf_token %}
            
            <!-- رمز التحقق OTP -->
            <div class="mb-3 text-center">
                <label class="form-label text-secondary fw-bold small text-start w-100">رمز التحقق (OTP) <span class="text-danger">*</span></label>
                <input type="text" name="otp_code" maxlength="6" class="form-control form-control-lg text-center fw-bold fs-3 letter-spacing-2" placeholder="------" required autofocus autocomplete="off" inputmode="numeric">
            </div>

            <!-- كلمة السر الجديدة -->
            <div class="mb-3">
                <label class="form-label text-secondary fw-bold small">كلمة السر الجديدة <span class="text-danger">*</span></label>
                <input type="password" name="new_password" class="form-control form-control-lg fs-6" placeholder="8 أحرف على الأقل" minlength="8" required>
            </div>

            <!-- تأكيد كلمة السر -->
            <div class="mb-3">
                <label class="form-label text-secondary fw-bold small">تأكيد كلمة السر الجديدة <span class="text-danger">*</span></label>
                <input type="password" name="confirm_password" class="form-control form-control-lg fs-6" placeholder="إعادة كتابة كلمة السر" minlength="8" required>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success btn-lg rounded-3 fw-bold fs-6 py-2">
                    تغيير كلمة السر وتأكيد الحساب 🚀
                </button>
            </div>
        </form>

        <hr class="my-3 my-sm-4">
        <p class="mb-0 text-secondary small">
            لم يصلك الرمز؟ <a href="{% url 'resend_otp' %}" class="text-primary fw-bold text-decoration-none">إعادة إرسال الرمز</a>
        </p>
    </div>
</div>

</body>
</html>
