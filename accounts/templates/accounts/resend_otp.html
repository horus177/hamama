<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة إرسال رمز التحقق - مزرعتي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card shadow-lg border-0 rounded-4 my-auto text-center" style="max-width: 420px; width: 100%;">
    <div class="card-body p-3 p-sm-4">
        <div class="mb-3">
            <span style="font-size: 50px;">📩</span>
            <h4 class="fw-bold text-primary mt-2 fs-4">إعادة إرسال رمز التحقق</h4>
            <p class="text-muted small mb-0">إذا لم يصلك الرمز السابق، يمكنك طلب إرسال رمز تحقق جديد إلى بريدك الإلكتروني.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} py-2 small my-2">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="mt-4">
            {% csrf_token %}
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold fs-6 py-2">
                    إرسال رمز جديد الآن 🚀
                </button>
                <a href="{% url 'verify_otp' %}" class="btn btn-outline-secondary rounded-3 fs-6 py-2">
                    العودة لصفحة أدخال الرمز
                </a>
            </div>
        </form>

        <hr class="my-3 my-sm-4">
        <p class="mb-0 text-secondary small">
            تواجه مشكلة؟ <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">تسجيل الدخول</a>
        </p>
    </div>
</div>

</body>
</html>
