{% extends 'base.html' %}

{% block title %}تسجيل مبيعات - مزرعتي{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white text-center py-3">
                    <h5 class="card-title fw-bold m-0">💰 تسجيل عملية بيع</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-bold">وصف المبيعات <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" placeholder="مثال: بيع زغاليل زاجل" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">القص المصدر (اختياري)</label>
                            <select name="pair" class="form-select">
                                <option value="">-- بيع عام (بدون تحديد قص) --</option>
                                {% for pair in pairs %}
                                    <option value="{{ pair.id }}">{{ pair.pair_code }} - {{ pair.breed }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">العدد <span class="text-danger">*</span></label>
                                <input type="number" name="quantity" class="form-control" value="1" min="1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">المبلغ الإجمالي (ج.م) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">تسجيل عملية البيع</button>
                            <a href="{% url 'farm_home' %}" class="btn btn-outline-secondary">إلغاء وعودة</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
