{% extends 'base.html' %}

{% block title %}تسجيل المتابعة اليومية - مزرعتي{% endblock %}

{% block content %}
<style>
    /* تحسين شكل حقول الزيادة والنقصان على الموبايل */
    .touch-counter .btn {
        width: 55px;
        font-weight: bold;
        font-size: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .touch-counter input {
        font-weight: bold;
        font-size: 1.2rem;
    }
</style>

<div class="container py-3 py-md-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h5 class="card-title fw-bold m-0 fs-5">📋 تسجيل المتابعة اليومية</h5>
                </div>
                <div class="card-body p-3 p-md-4">
                    
                    <form method="post">
                        <!-- حماية Django CSRF -->
                        {% csrf_token %} 
                        
                        {% for field in form %}
                        <div class="mb-3 mb-md-4">
                            <label class="form-label fw-bold fs-6 mb-2">{{ field.label }}</label>
                            <div class="input-group input-group-lg touch-counter">
                                <!-- زرار الطرح -->
                                <button class="btn btn-outline-danger" type="button" onclick="decrement('{{ field.id_for_label }}')">➖</button>
                                
                                <!-- حقل الإدخال -->
                                {{ field }}
                                
                                <!-- زرار الجمع -->
                                <button class="btn btn-outline-success" type="button" onclick="increment('{{ field.id_for_label }}')">➕</button>
                            </div>
                            {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors }}
                            </div>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold fs-6 py-2">حفظ البيانات 💾</button>
                            <a href="{% url 'farm_home' %}" class="btn btn-outline-secondary py-2">إلغاء وعودة</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- سكريبت التشغيل الخاص بأزرار الزيادة والنقصان -->
<script>
    function increment(fieldId) {
        let input = document.getElementById(fieldId);
        if (input) {
            input.value = parseInt(input.value || 0) + 1;
        }
    }
    function decrement(fieldId) {
        let input = document.getElementById(fieldId);
        if (input && parseInt(input.value || 0) > 0) {
            input.value = parseInt(input.value) - 1;
        }
    }
</script>
{% endblock %}
