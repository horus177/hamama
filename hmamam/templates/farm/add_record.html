<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل المتابعة اليومية</title>
    <!-- مكتبة Bootstrap للتصميم السريع -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
            <h4>تسجيل المتابعة اليومية</h4>
        </div>
        <div class="card-body">
            
            <form method="post">
                <!-- مهم جداً للحماية في ديجانجو -->
                {% csrf_token %} 
                
                {% for field in form %}
                <div class="mb-4">
                    <label class="form-label fw-bold">{{ field.label }}</label>
                    <div class="input-group input-group-lg">
                        <!-- زرار الطرح -->
                        <button class="btn btn-outline-danger" type="button" onclick="decrement('{{ field.id_for_label }}')">➖</button>
                        
                        <!-- حقل الإدخال -->
                        {{ field }}
                        
                        <!-- زرار الجمع -->
                        <button class="btn btn-outline-success" type="button" onclick="increment('{{ field.id_for_label }}')">➕</button>
                    </div>
                </div>
                {% endfor %}

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">حفظ البيانات 💾</button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- سكريبت بسيط جداً لتشغيل زراير الـ + والـ - -->
<script>
    function increment(fieldId) {
        let input = document.getElementById(fieldId);
        input.value = parseInt(input.value || 0) + 1;
    }
    function decrement(fieldId) {
        let input = document.getElementById(fieldId);
        if (parseInt(input.value || 0) > 0) {
            input.value = parseInt(input.value) - 1;
        }
    }
</script>

</body>
</html>
