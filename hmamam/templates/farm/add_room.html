{% extends 'base.html' %}

{% block title %}إضافة غرفة جديدة - مزرعتي{% endblock %}

{% block content %}
<div class="container py-3 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-secondary text-white text-center py-3">
                    <h5 class="card-title fw-bold m-0 fs-5">🏠 إضافة غية أو غرفة تربية جديدة</h5>
                </div>
                <div class="card-body p-3 p-md-4">
                    <form method="POST">
                        {% csrf_token %}

                        <!-- اسم الغرفة -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">اسم الغرفة / الغية <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control form-control-lg fs-6" placeholder="مثال: الغرفة الشرقية، غية السطوح..." required>
                        </div>

                        <!-- أزرار الإرسال والإلغاء -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-secondary btn-lg fw-bold fs-6 py-2">حفظ الغرفة</button>
                            <a href="{% url 'farm_home' %}" class="btn btn-outline-secondary py-2">إلغاء وعودة</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
